name: Compilar Batocera Customizado
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: batocera/buildroot-bcm2835:latest
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar e Compilar Kernel
      run: |
        make batocera-x86_64_defconfig
        make linux-rebuild
        make
